name: Continuous Integration & Verification

on:
  push:
    branches: [ main, elusoc ]
  pull_request:
    branches: [ main, elusoc ]

jobs:
  server-verification:
    name: Backend Test Suite & Lint
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Backend Integration & Rate Limiter Tests
        env:
          MONGO_URI: mongodb://localhost:27017/samridhi-test
          JWT_SECRET: test_jwt_secret_key_12345
          JWT_EXPIRE: 7d
        run: |
          cd server
          npm test

  client-verification:
    name: Frontend Lint & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Verify ESLint Rules
        run: |
          cd client
          npm run lint

      - name: Build Frontend Application
        run: |
          cd client
          npm run build
