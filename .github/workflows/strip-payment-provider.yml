name: Remove Payment Provider Integration

on:
  push:
    branches:
      - fix/comprehensive-audit-remaining

permissions:
  contents: write

jobs:
  cleanup:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: remove payment provider integration') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove payment-provider packages and regenerate lockfiles
        run: |
          cd server
          npm uninstall stripe
          cd ../client
          npm uninstall @stripe/react-stripe-js @stripe/stripe-js

      - name: Remove payment-provider code paths
        shell: python
        run: |
          from pathlib import Path
          import re

          order = Path('server/controllers/orderController.js')
          text = order.read_text()
          text = re.sub(r'^.*Stripe.*\n', '', text, flags=re.MULTILINE)
          text = re.sub(r'\n\s*if \(paymentMethod === "Online"\) \{\n\s*const stripe = .*?\n\s*const paymentIntent = .*?\n\s*amount: Math\.round\(grandTotal \* 100\),.*?\n\s*currency: "inr",\n\s*metadata: \{\n\s*orderId: order\._id\.toString\(\),\n\s*\},\n\s*\}\n\s*clientSecret = paymentIntent\.client_secret;\n\s*\}\n', '\n', text, flags=re.DOTALL)
          text = text.replace('    let clientSecret = null;\n', '')
          text = text.replace('      clientSecret,\n', '')
          order.write_text(text)

          checkout = Path('client/src/pages/Checkout.jsx')
          text = checkout.read_text()
          text = re.sub(r'^import \{ loadStripe \} from "@stripe/stripe-js";\n', '', text, flags=re.MULTILINE)
          text = re.sub(r'^import \{ Elements \} from "@stripe/react-stripe-js";\n', '', text, flags=re.MULTILINE)
          text = re.sub(r'^import StripePaymentForm from "\.\./components/StripePaymentForm";\n', '', text, flags=re.MULTILINE)
          text = re.sub(r'^const stripePromise = .*?;\n', '', text, flags=re.MULTILINE)
          text = re.sub(r', clientSecret', '', text)
          text = re.sub(r'\n\s*\} else if \(clientSecret\) \{\n\s*dispatch\(fetchCart\(\)\);\n\s*\}', '', text)
          text = text.replace(', clientSecret', '')
          text = re.sub(r'\n\s*if \(clientSecret\) \{.*?\n\s*\}\n\n\s*if \(!cart', '\n  if (!cart', text, flags=re.DOTALL)
          checkout.write_text(text)

          slice_path = Path('client/src/store/order/orderSlice.js')
          text = slice_path.read_text()
          text = text.replace('    clientSecret: null,\n', '')
          text = text.replace('      state.clientSecret = action.payload.clientSecret || null;\n', '')
          text = text.replace('      state.clientSecret = null;\n', '')
          slice_path.write_text(text)

      - name: Remove obsolete provider environment references and documentation
        shell: bash
        run: |
          find . -type f \( -name '*.md' -o -name '*.txt' -o -name '*.env*' \) -not -path './.git/*' -print0 | xargs -0 -r sed -i -E '/STRIPE_|stripe|Stripe/d'

      - name: Remove this one-shot cleanup workflow
        run: rm -f .github/workflows/strip-payment-provider.yml

      - name: Verify no provider references remain
        run: |
          if git grep -n -i -E 'stripe|STRIPE_' -- ':!package-lock.json'; then
            echo 'Provider references remain in tracked source files.'
            exit 1
          fi

      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- client/package.json client/package-lock.json client/src/pages/Checkout.jsx client/src/store/order/orderSlice.js server/package.json server/package-lock.json server/controllers/orderController.js .github/workflows/strip-payment-provider.yml
          git add -- $(git ls-files '*.md' '*.txt' '.env*') || true
          git commit -m 'chore: remove payment provider integration'
          git push
