<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Samridhi Enterprises - Your one-stop shop for premium bike parts and accessories." />
    <meta name="theme-color" content="#ffffff" />
    <meta property="og:title" content="Samridhi Enterprises" />
    <meta property="og:description" content="Samridhi Enterprises - Your one-stop shop for premium bike parts and accessories." />
    <meta property="og:type" content="website" />
    <title>Samridhi Enterprises</title>
    <script>
      // Apply theme before first paint to prevent a light/dark flash.
      (function () {
        try {
          var t = localStorage.getItem("theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.classList.toggle("dark", t === "dark");
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
